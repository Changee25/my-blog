# ============================================
# 站点基础信息：这三项一定要改成你自己的
# ============================================
title: 我的个人博客
description: 记录学习、项目，和一些没想明白的事
author: 你的名字
email: you@example.com

# 站点地址：已按你的仓库 Changee25/my-blog 填好
# 仓库名是 my-blog，属于「项目站」，网址是 https://changee25.github.io/my-blog/
# 以后如果把仓库改名为 Changee25.github.io，就把 baseurl 改回 ""
url: "https://changee25.github.io"
baseurl: "/my-blog"

# ============================================
# 主题：minima 是 GitHub Pages 官方支持的主题，不用自己写样式
# ============================================
theme: minima
show_excerpts: true
header_pages:
  - about.md

# ============================================
# 语言与时间
# ============================================
lang: zh-CN
timezone: Asia/Shanghai

# 文章网址格式：/2026/10/26/article-name/
permalink: /:year/:month/:day/:title/

# ============================================
# Markdown 渲染
# ============================================
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
